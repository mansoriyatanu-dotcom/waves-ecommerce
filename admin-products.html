<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products — Waves</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#070503;
  color:#ece7e0;
  font-family:'Inter',sans-serif;
  padding:40px 20px;
}

h1{
  text-align:center;
  margin-bottom:40px;
  color:#ffbc6e;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:28px;
  max-width:1400px;
  margin:auto;
}

.card{
  background:#12100e;
  border:1px solid #2a221c;
  border-radius:28px;
  overflow:hidden;
  transition:0.35s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 35px rgba(0,0,0,0.4);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.info{
  padding:24px;
}

.title{
  font-size:1.4rem;
  margin-bottom:10px;
  color:#ffbc6e;
}

.price{
  font-size:1.2rem;
  font-weight:700;
  margin-bottom:14px;
}

.desc{
  color:#bcac9a;
  line-height:1.7;
  margin-bottom:22px;
}

.actions{
  display:flex;
  gap:14px;
}

.btn{
  flex:1;
  padding:13px;
  border:none;
  border-radius:40px;
  cursor:pointer;
  font-weight:700;
}

.edit{
  background:#d97a2b;
  color:#070503;
}

.delete{
  background:#8b1f1f;
  color:white;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:20px;
}

.modal-content{
  background:#12100e;
  width:100%;
  max-width:700px;
  border-radius:30px;
  padding:35px;
  max-height:90vh;
  overflow:auto;
}

.input{
  width:100%;
  padding:14px 18px;
  margin-bottom:16px;
  background:#1a1410;
  border:1px solid #2e231c;
  border-radius:16px;
  color:white;
}

textarea.input{
  min-height:120px;
}

.save-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:50px;
  background:#d97a2b;
  color:black;
  font-weight:700;
  cursor:pointer;
}

.close-btn{
  margin-top:12px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:50px;
  background:#2a221c;
  color:white;
  cursor:pointer;
}

</style>

</head>

<body>

<h1>
Manage Products
</h1>

<div class="grid" id="productsGrid"></div>

<div class="modal" id="editModal">

<div class="modal-content">

<h2 style="margin-bottom:25px;color:#ffbc6e;">
Edit Product
</h2>

<input id="edit-name" class="input" placeholder="Name">

<textarea id="edit-description" class="input" placeholder="Short Description"></textarea>

<textarea id="edit-details" class="input" placeholder="Long Details"></textarea>

<input id="edit-price" class="input" placeholder="Price">

<input id="edit-stock" class="input" placeholder="Stock">

<input id="edit-discount" class="input" placeholder="Discount">

<input id="edit-category" class="input" placeholder="Category">

<input id="edit-img" class="input" placeholder="Main Image">

<input id="edit-image2" class="input" placeholder="Second Image">

<input id="edit-image3" class="input" placeholder="Third Image">

<input id="edit-amazon" class="input" placeholder="Amazon Link">

<input id="edit-flipkart" class="input" placeholder="Flipkart Link">

<input id="edit-whatsapp" class="input" placeholder="WhatsApp Link">

<button class="save-btn" onclick="saveProduct()">
Save Changes
</button>

<button class="close-btn" onclick="closeModal()">
Cancel
</button>

</div>

</div>

<script>

const token =
localStorage.getItem("token");

let currentProductId = null;

async function loadProducts(){

  const res =
  await fetch(
    "http://localhost:3000/api/products"
  );

  const products =
  await res.json();

  const grid =
  document.getElementById("productsGrid");

  grid.innerHTML = "";

  products.forEach(prod=>{

    grid.innerHTML += `

    <div class="card">

      <img src="${prod.img}">

      <div class="info">

        <div class="title">
          ${prod.name}
        </div>

        <div class="price">
          ₹${prod.price}
        </div>

        <div class="desc">
          ${prod.description || ""}
        </div>

        <div class="actions">

          <button
            class="btn edit"
            onclick='openEdit(${JSON.stringify(prod)})'>
            Edit
          </button>

          <button
            class="btn delete"
            onclick="deleteProduct('${prod.id}')">
            Delete
          </button>

        </div>

      </div>

    </div>
    `;
  });
}

function openEdit(prod){

  currentProductId =
  prod.id;

  document.getElementById("edit-name").value =
  prod.name || "";

  document.getElementById("edit-description").value =
  prod.description || "";

  document.getElementById("edit-details").value =
  prod.details || "";

  document.getElementById("edit-price").value =
  prod.price || "";

  document.getElementById("edit-stock").value =
  prod.stock || "";

  document.getElementById("edit-discount").value =
  prod.discount || "";

  document.getElementById("edit-category").value =
  prod.category || "";

  document.getElementById("edit-img").value =
  prod.img || "";

  document.getElementById("edit-image2").value =
  prod.image2 || "";

  document.getElementById("edit-image3").value =
  prod.image3 || "";

  document.getElementById("edit-amazon").value =
  prod.amazon || "";

  document.getElementById("edit-flipkart").value =
  prod.flipkart || "";

  document.getElementById("edit-whatsapp").value =
  prod.whatsapp || "";

  document.getElementById("editModal")
  .style.display = "flex";
}

function closeModal(){

  document.getElementById("editModal")
  .style.display = "none";
}

async function saveProduct(){

  const data = {

    name:
    document.getElementById("edit-name").value,

    description:
    document.getElementById("edit-description").value,

    details:
    document.getElementById("edit-details").value,

    price:
    document.getElementById("edit-price").value,

    stock:
    document.getElementById("edit-stock").value,

    discount:
    document.getElementById("edit-discount").value,

    category:
    document.getElementById("edit-category").value,

    img:
    document.getElementById("edit-img").value,

    image2:
    document.getElementById("edit-image2").value,

    image3:
    document.getElementById("edit-image3").value,

    amazon:
    document.getElementById("edit-amazon").value,

    flipkart:
    document.getElementById("edit-flipkart").value,

    whatsapp:
    document.getElementById("edit-whatsapp").value
  };

  const res =
  await fetch(
    `http://localhost:3000/api/products/${currentProductId}`,
    {

      method:"PUT",

      headers:{
        "Content-Type":"application/json",
        Authorization:token
      },

      body:JSON.stringify(data)
    }
  );

  const result =
  await res.json();

  alert(result.message || result.error);

  closeModal();

  loadProducts();
}

async function deleteProduct(id){

  const confirmDelete =
  confirm("Are you sure you want to delete this product?");

  if(!confirmDelete) return;

  const token =
  localStorage.getItem("token");

  const res =
  await fetch(
    `http://localhost:3000/api/products/${id}`,
    {
      method:"DELETE",
      headers:{
        Authorization: token
      }
    }
  );

  const result =
  await res.json();

  alert(result.message || result.error);

  loadProducts();
}


loadProducts();

</script>

</body>
</html>
