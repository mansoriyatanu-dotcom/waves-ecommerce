<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wishlist — Waves</title>

<style>
body{
  background:#070503;
  color:#ece7e0;
  font-family:Arial;
  padding:40px;
}

h1{
  color:#ffbc6e;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

.card{
  background:#12100e;
  border:1px solid #2e231c;
  border-radius:25px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.info{
  padding:20px;
}

button{
  background:#d97a2b;
  border:none;
  padding:10px 18px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Your Wishlist ♡</h1>

<div class="grid" id="wishlistGrid"></div>

<script>
function loadWishlist(){
  const grid = document.getElementById("wishlistGrid");
  const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  if(wishlist.length === 0){
    grid.innerHTML = "<p>Your wishlist is empty.</p>";
    return;
  }

  grid.innerHTML = "";

  wishlist.forEach(item => {
    grid.innerHTML += `
      <div class="card">
        <img src="${item.img}">
        <div class="info">
          <h3>${item.name}</h3>
          <p>₹${item.price}</p>

          <button onclick="viewProduct('${item.id}')">
            View Product
          </button>

          <button onclick="removeWish('${item.id}')">
            Remove
          </button>
        </div>
      </div>
    `;
  });
}

function viewProduct(id){
  window.location.href = "product.html?id=" + id;
}

function removeWish(id){
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
  wishlist = wishlist.filter(item => item.id !== id);
  localStorage.setItem("wishlist", JSON.stringify(wishlist));
  loadWishlist();
}

loadWishlist();
</script>

</body>
</html>
